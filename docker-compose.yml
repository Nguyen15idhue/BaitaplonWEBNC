services:
  mysql:
    image: mysql:8.4
    container_name: travela-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-travela}
      MYSQL_USER: ${MYSQL_USER:-travela}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-travela_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    # N15: chỉ expose khi dev; prod đóng port bằng profile hoặc override.
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: travela-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-travela};User=${MYSQL_USER:-travela};Password=${MYSQL_PASSWORD:-travela_password}"
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-min-32-chars!!}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/wwwroot/uploads
    ports:
      - "5000:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: travela-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3001:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
  backend_uploads:
