services:
  mysql:
    image: mysql:8.4
    container_name: travela-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-travela}
      MYSQL_USER: ${MYSQL_USER:-travela}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-travela_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: travela-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-travela};User=${MYSQL_USER:-travela};Password=${MYSQL_PASSWORD:-travela_password}"
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-min-32-chars!!}
    depends_on:
      - mysql
    ports:
      - "5000:8080"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: travela-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3001:80"

volumes:
  mysql_data:
