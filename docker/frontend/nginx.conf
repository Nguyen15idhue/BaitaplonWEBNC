server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # N13: gzip + cache asset hash 1 năm, /api và /health không cache.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback: mọi route không phải file và không phải /api trả về index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # /api không slash -> redirect về /api/ để khỏi rơi vào SPA.
    location = /api {
        return 301 /api/;
    }

    # Ảnh tour upload do backend phục vụ (^~ để thắng location regex asset bên dưới).
    location ^~ /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Proxy API sang backend trong cùng Docker network.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store";
    }

    # Health backend qua Nginx (FE gọi /api/../health trong skeleton).
    location = /health {
        proxy_pass http://backend:8080/health;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }

    location = /health/live {
        proxy_pass http://backend:8080/health/live;
        proxy_set_header Host $host;
    }
}
